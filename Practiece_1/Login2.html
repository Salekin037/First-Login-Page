
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DarkWeb</title>
    <link rel="stylesheet" href="/login2.css">
</head>

<body>

    <!-- Main Login Container -->
    <div class="login-box">

        <h1>sign in</h1>

        <form action="#" method="post">

            <!-- Username -->
            <input
                type="text"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <!-- Password -->
            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <!-- Remember Me & Forgot Password -->
            <div class="options">

                <label class="remember">
                    <input type="checkbox"
                           name="remember">
                    Remember me
                </label>

                <a href="#">Forgot Password</a>

            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <!-- Registration Link -->
        <p class="register">
            Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

</body>
</html>
